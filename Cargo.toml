[workspace]
resolver = "2"
members = [
    "crates/qnero-pqcrypto",
    "crates/qnero-note-core",
    "crates/qnero-notes",
    "crates/qnero-circuit",
    "crates/qnero-prover",
    "crates/qnero-verifier",
    "crates/qnero-aggregator",
    "crates/qnero-circuit-builder",
]
# The chain fork is its own workspace with its own toolchain and lock file, and
# it lives inside this directory only because it is a git subtree. Excluding it
# is what stops Cargo from claiming its members as ours.
exclude = ["chain"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/DigitalGuards/qnero"

[workspace.dependencies]
qnero-pqcrypto = { path = "crates/qnero-pqcrypto" }
qnero-note-core = { path = "crates/qnero-note-core" }
qnero-notes = { path = "crates/qnero-notes" }
qnero-circuit = { path = "crates/qnero-circuit" }
qnero-prover = { path = "crates/qnero-prover" }
qnero-verifier = { path = "crates/qnero-verifier" }
qnero-aggregator = { path = "crates/qnero-aggregator" }
qnero-circuit-builder = { path = "crates/qnero-circuit-builder" }
# no_std, and its `std` feature is empty, so nothing here asks for it: the
# runtime links this crate through `qnero-circuit` on wasm.
qp-poseidon-core = { version = "3.1.0", default-features = false }
qp-plonky2 = { version = "=1.5.5", default-features = false, features = ["std"] }
qp-plonky2-verifier = { version = "=1.5.5", default-features = false }
anyhow = { version = "1.0", default-features = false }
bech32 = "0.9"
zeroize = { version = "1.8", features = ["derive"] }
rand = "0.9"
rand_core = "0.9"
subtle = "2"
thiserror = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
