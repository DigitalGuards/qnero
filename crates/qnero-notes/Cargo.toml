[package]
name = "qnero-notes"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qnero shielded note primitives: keys, addresses, Poseidon commitments, nullifiers, ML-KEM note encryption"

[dependencies]
qnero-note-core = { workspace = true }
qnero-pqcrypto = { workspace = true }
qp-poseidon-core = { workspace = true }
bech32 = { workspace = true }
zeroize = { workspace = true }
rand_core = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
# A dev-dependency cycle, which Cargo allows. `ct_digest` is defined once, in
# the crate a runtime can link without the prover stack, and the round-trip
# test that covers it needs real `NoteCiphertext` values, which live here.
qnero-circuit = { path = "../qnero-circuit", default-features = false }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
qp-plonky2 = { workspace = true }
