[package]
name = "qnero-prover-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The browser surface of a Qnero wallet: key derivation, note decryption and one private-batch proof, compiled to wasm32-unknown-unknown"

[lib]
# `cdylib` is the wasm artifact; `rlib` is what the native gates and this
# crate's own tests build.
crate-type = ["cdylib", "rlib"]

[dependencies]
qnero-prover = { workspace = true }
qnero-notes = { workspace = true }
qnero-circuit = { workspace = true }
qnero-note-core = { workspace = true }
qp-plonky2 = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
wasm-bindgen = "0.2"

# Two getrandom majors, two direct dependencies, one cfg. Cargo features are
# per crate *version* and additive, so naming one does nothing for the other
# and nothing upstream can turn either on:
#
#   0.3 arrives through rand 0.9, which `qnero-aggregator` uses to draw the
#       padding nullifier preimages and the slot shuffle, and which
#       `qnero-pqcrypto`'s `std` feature turns on for OS randomness.
#   0.4 arrives through rand 0.10, which qp-plonky2 uses for `F::rand()` inside
#       `RandomValueGenerator`. That is where every zero-knowledge blinding
#       value comes from, and it is drawn at PROVING time, so a missing backend
#       is not a startup failure: it lands tens of seconds into the first
#       private batch.
#
# Both also need `--cfg getrandom_backend="wasm_js"`, which `.cargo/config.toml`
# sets for this target. The feature and the cfg are each necessary and neither
# is sufficient: without them the build stops at getrandom's own
# `compile_error!` naming the version it reached first.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
# The runtime's own verifier, so the browser's proof is checked by the code a
# chain would check it with. This declaration requests no features and cannot
# narrow the set either: `qnero-aggregator` declares `qnero-verifier` with
# `leaf` on, and it reaches this crate through `qnero-prover`, so
# `cargo tree -p qnero-prover-wasm -e normal -f '{p} {f}'` prints
# `default,leaf,std` with or without this line. A gate that needs the runtime's
# exact feature set needs a target that does not pull the aggregator, and this
# is not that.
qnero-verifier = { workspace = true }
# The definition of the chain's leaf-slot count, so `CHAIN_NUM_LEAVES` is held
# to it by a test rather than by a literal that a later `N` would silently
# leave behind. A dev-dependency never enters the cdylib and never appears in
# `cargo tree -e normal`, so this links no `std::fs` staging tool into the
# browser and leaves the rayon guard untouched. It resolves no new feature
# either: its `qnero-circuit/zk`, `qnero-verifier/leaf` and `qnero-aggregator`
# default are already unified on through the normal path, and its own
# `parallel` feature is off by default and unrequested here.
qnero-circuit-builder = { workspace = true }

[features]
default = []
# Deliberately absent: anything that turns on `parallel` anywhere below this
# crate. rayon-core spawns `std::thread`, which on wasm32-unknown-unknown
# without the atomics target feature fails at runtime, and rayon needs a
# SharedArrayBuffer-backed pool to be worth anything at all.
# `tests/no_parallel.rs` asserts the dependency tree stays rayon-free.
