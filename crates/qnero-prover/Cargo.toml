[package]
name = "qnero-prover"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Prover for the Qnero v0 shielded spend leaf circuit"

[dependencies]
qnero-circuit = { workspace = true }
qnero-aggregator = { workspace = true }
qp-plonky2 = { workspace = true }
anyhow = { workspace = true, features = ["std"] }

[dev-dependencies]
qnero-notes = { workspace = true }
# The leaf entry points are behind a non-default feature; the tests here are
# exactly the callers that legitimately verify a raw leaf proof.
qnero-verifier = { workspace = true, features = ["leaf"] }
# The negative tests write a public target that disagrees with the witness
# beside it; see `qnero_circuit::witness::PublicOverrides`.
qnero-circuit = { workspace = true, features = ["test-support"] }
rand = { workspace = true }

[features]
default = []
# Build and prove the leaf with plonky2 row blinding on. Not a production
# configuration: zero knowledge belongs at the private batch. It exists so the
# ZK path stays compiled and exercised.
zk = ["qnero-circuit/zk"]
# Let plonky2 use rayon. Off by default so a wallet cannot saturate a machine
# unasked; a caller that turns it on should bound the pool with
# RAYON_NUM_THREADS. The proofs are identical either way.
parallel = ["qp-plonky2/parallel", "qnero-aggregator/parallel"]
