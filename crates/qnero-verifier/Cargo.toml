[package]
name = "qnero-verifier"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Verifier for the Qnero v0 shielded spend leaf circuit"

[dependencies]
# Layout constants only: the circuit feature stays off so this crate does not
# pull in plonky2 or the note primitives.
qnero-circuit = { path = "../qnero-circuit", version = "0.1.0", default-features = false }
qp-plonky2-verifier = { workspace = true }
anyhow = { workspace = true }

[features]
# On by default for the wallet-side aggregator and the tests. A runtime takes
# this crate with default features off: everything here is `no_std` + `alloc`,
# which is what lets `pallet-shielded` link it into a wasm runtime at M4.
default = ["std"]
std = ["anyhow/std", "qp-plonky2-verifier/std"]
