[package]
name = "qnero-wallet"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Qnero v0 wallet CLI: keygen, shield, scan, spend, submit"

[[bin]]
name = "qnero-wallet"
path = "src/main.rs"

[dependencies]
qnero-notes = { workspace = true }
qnero-circuit = { workspace = true }
qnero-prover = { workspace = true }
qnero-circuit-builder = { workspace = true }
qnero-pqcrypto = { workspace = true }
qnero-state-proof = { workspace = true }
qp-poseidon-core = { workspace = true }
qp-rusty-crystals-dilithium = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
clap = { workspace = true }
codec = { workspace = true }
frame-metadata = { workspace = true }
scale-info = { workspace = true }
blake2 = { workspace = true }
twox-hash = { workspace = true }
# `tls` is asked for here, because the workspace entry carries no features and
# a crate is built on its own: `cargo build -p qnero-wallet --features
# parallel`, which is the line README.md and docs/WALLET.md give, resolves this
# manifest alone. Without the feature every https:// node answers "cannot make
# HTTPS request because no TLS backend is configured", and the public testnet
# is reached at https://rpc.<domain>. A whole-workspace build hid it: the
# faucet asks for the same dependency with `tls` and Cargo unifies the features
# across one build. The backend is rustls, the same one the faucet's entry
# pulls, so the binary carries its own TLS stack and asks nothing of the host's
# OpenSSL. `tests/https_backend.rs` is the guard. `json` stays off: this client
# sends and reads strings.
ureq = { workspace = true, features = ["tls"] }
serde = { workspace = true }
serde_json = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
zeroize = { workspace = true }
# One call: `TIOCGWINSZ` on standard output, so the `balance` table sizes its
# memo column from the terminal it is printed into. `COLUMNS` cannot answer
# that question, because bash and zsh maintain it without exporting it.
libc = { workspace = true }

[dev-dependencies]
qnero-state-proof = { workspace = true, features = ["fixtures"] }
# The public-batch measurement builds an aggregator's circuit over the wallet's
# own private-batch proof. Nothing in the wallet itself aggregates.
qnero-aggregator = { workspace = true }

[features]
default = []
# Let plonky2 use rayon while proving. Off by default, the way `qnero-prover`
# keeps it off: a wallet that saturates every core unasked is a wallet that
# freezes the machine it runs on. Turn it on and bound the pool with
# RAYON_NUM_THREADS; the proofs are identical either way.
parallel = ["qnero-prover/parallel"]
