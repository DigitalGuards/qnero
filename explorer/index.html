<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="silQ Road is the block explorer for a Qnero chain: heads, settlements, entries and what each block reveals."
    />
    <title>silQ Road, the Qnero explorer</title>
    <!-- The tab mark, written inline so it costs no request and adds no asset.
         A tab narrowed past its title, a pinned tab and a bookmark are the
         icon and nothing else, and with none declared both Qnero apps sat
         there as the browser's blank page glyph and took a 404 on
         /favicon.ico from the host on every load. `img-src 'self' data:` is
         already in the header `README.md` gives a host to send. The mark is
         the same Q as Qloak's over a road, so the two read as one family and
         apart at 16 px. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23161416'/%3E%3Ccircle cx='16' cy='13' r='7' fill='none' stroke='%23fcfbfc' stroke-width='3'/%3E%3Cpath d='M17.5 18 L22 22.5' fill='none' stroke='%23fcfbfc' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M4 28 h5 m3 0 h5 m3 0 h5' fill='none' stroke='%23e6a145' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <!-- The stored theme, applied before anything paints. It is a file and not
         an inline script because this site ships under `script-src 'self'
         'wasm-unsafe-eval'`, with no `'unsafe-inline'`. -->
    <script src="./theme.js"></script>
  </head>
  <body>
    <!--
      The shell, painted before the bundle.

      The bundle is 1.2 MB, 440 kB compressed, and index.html used to ship an
      empty #root, so a phone on a slow link had a blank page until it was
      parsed and then one 11 px muted line for the length of the connect. This
      is the same header the app renders, so the first paint is the page's own
      shape rather than nothing, and React replaces it when it mounts.
    -->
    <div id="root">
      <header class="masthead">
        <a class="masthead__brand" href="#/">silQ Road</a>
        <span class="masthead__status">
          <span class="dot"></span>
          <span>connecting</span>
        </span>
      </header>
      <nav class="nav" aria-label="Sections">
        <a class="nav__link" href="#/">Chain</a>
        <a class="nav__link" href="#/blocks">Blocks</a>
        <a class="nav__link" href="#/search">Search</a>
        <a class="nav__link" href="#/reveals">Reveals</a>
      </nav>
      <div class="indeterminate"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
