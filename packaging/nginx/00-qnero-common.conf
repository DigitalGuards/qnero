# /etc/nginx/conf.d/00-qnero-common.conf
#
# The http-level pieces every Qnero vhost needs. It sorts first so the map and
# the limit zone exist before any server block references them.
#
# Three rules from a sibling deployment's incidents, all of which apply here:
#
#  1. nginx on this host is 1.24, so the listen line is `listen 443 ssl http2`.
#     The separate `http2 on;` directive is 1.25 and later and fails the config
#     test here.
#  2. Never pin ssl_ciphers in a vhost. OpenSSL 3.5 plus a CDN's TLS 1.2 origin
#     pulls plus an ECC origin certificate produced 525 "bad cipher" errors.
#     The distro default list is correct.
#  3. Any proxy_pass to an EXTERNAL hostname must resolve at request time
#     (`resolver 127.0.0.53;` plus `set $upstream ...;` before the proxy_pass),
#     or a DNS blip fails `nginx -t` during an unattended restart and takes
#     every vhost on the host offline. Every proxy_pass in this set targets
#     127.0.0.1, so none of them needs it. A future one might.

# The WebSocket upgrade map, for rpc.<domain>.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# What every limit below counts, and it is NOT the address.
#
# `$binary_remote_addr` is all sixteen bytes of an IPv6 address, and an
# ordinary residential or cloud client is handed a /64: 2^64 addresses, every
# one of them a fresh key, so a per-client limit keyed on the full address
# bounds nothing at all. An attacker does not need a botnet, only the prefix
# their ISP already gave them. So IPv6 is grouped to its /64 and IPv4 is left
# as itself.
#
# nginx writes IPv6 compressed, so the text is what has to be read, and every
# expression here errs toward grouping MORE addresses together rather than
# fewer. A key that is too wide costs a client the company of a few neighbours
# it did not choose. A key that is too narrow costs the limit entirely, which
# is the bug being fixed, so the order matters:
#
#  - An IPv4-mapped address keys on the IPv4 inside it.
#  - Four written-out groups are exactly the /64, and every address in that /64
#    lands on the same key whether its tail is compressed or not.
#  - Anything else contains a zero run somewhere in the first four groups, so
#    the /64 cannot be read off the text at all. The key is the text before the
#    run, which is always a PREFIX of the network part: wider than a /64, and
#    nothing the client can vary. Keying on what follows the run would read
#    interface bits and hand an attacker 2^64 keys again.
#  - `::1` reduces to the empty key, which nginx does not count. Loopback here
#    is nginx itself and the on-box probes.
#
# It is evaluated after the realip module has rewritten $remote_addr, since
# realip runs in the post-read phase and both limit modules run in preaccess.
# Without the include below it is the CDN's edge address being grouped, which
# is the failure that include exists to make loud.
map $remote_addr $limit_key {
    default                                                                            $remote_addr;
    "~^::[fF]{4}:(?<mapped>[0-9.]+)$"                                                   $mapped;
    "~^(?<net64>[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}:[0-9a-fA-F]{1,4}):"  $net64;
    "~^(?<zeroed>[0-9a-fA-F:]*?)::"                                                     $zeroed;
}

# A cheap outer bound in front of the faucet's own per-address and per-client
# limits, so an abusive client is refused here rather than by a process that
# holds a spend key.
limit_req_zone $limit_key zone=faucet_claim:10m rate=6r/m;

# The public RPC's only real per-caller bound, and it has to live here because
# the node has none.
#
# `--rpc-rate-limit` is "calls/minute for EACH CONNECTION" in the node's own
# help, and the middleware is built per accepted connection, so one client that
# opens 200 sockets gets 200 times the limit and also exhausts
# --rpc-max-connections, which is a refusal at connect for every wallet and
# explorer user. `--rpc-rate-limit-trust-proxy-headers` does not change that:
# in sc-rpc-server the proxy address is used for one thing, deciding whether a
# caller falls inside --rpc-rate-limit-whitelisted-ips and is therefore exempt.
# With no whitelist set the flag is inert.
limit_conn_zone $limit_key zone=rpc_conn:10m;
limit_req_zone $limit_key zone=rpc_calls:10m rate=240r/m;

# The real client address, behind the CDN.
#
# **A missing file here fails `nginx -t`, and that is the point.** The realip
# module is inert until it has a trusted-proxy list: $remote_addr stays the
# CDN's edge address for every proxied name, and every limit above then counts
# the whole internet as a handful of callers. Measured on nginx 1.24.0 with
# these files: twelve callers carrying twelve distinct CF-Connecting-IP headers
# got eight 200s and four 429s from `limit_conn rpc_conn 8`, with
# `limiting connections by zone "rpc_conn", client: 127.0.0.1` in the error
# log; with one set_real_ip_from covering the peer, twelve 200s. On the host
# that is the ninth wallet or explorer tab per CDN edge refused, and the
# faucet's 6 claims a minute shared by everybody. A config that cannot be
# tested is a far better failure than a limit that silently became global, so
# the list is included rather than commented, and it is generated rather than
# typed:
#
#   sudo ./scripts/fetch-real-ip-ranges.sh /etc/nginx/qnero-real-ip.conf
#
# Keep it current. A range that is trusted and should not be is a client that
# sets its own CF-Connecting-IP and is believed.
include /etc/nginx/qnero-real-ip.conf;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
