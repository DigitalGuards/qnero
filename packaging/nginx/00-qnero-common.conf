# /etc/nginx/conf.d/00-qnero-common.conf
#
# The http-level pieces every Qnero vhost needs. It sorts first so the map and
# the limit zone exist before any server block references them.
#
# Three rules from a sibling deployment's incidents, all of which apply here:
#
#  1. nginx on this host is 1.24, so the listen line is `listen 443 ssl http2`.
#     The separate `http2 on;` directive is 1.25 and later and fails the config
#     test here.
#  2. Never pin ssl_ciphers in a vhost. OpenSSL 3.5 plus a CDN's TLS 1.2 origin
#     pulls plus an ECC origin certificate produced 525 "bad cipher" errors.
#     The distro default list is correct.
#  3. Any proxy_pass to an EXTERNAL hostname must resolve at request time
#     (`resolver 127.0.0.53;` plus `set $upstream ...;` before the proxy_pass),
#     or a DNS blip fails `nginx -t` during an unattended restart and takes
#     every vhost on the host offline. Every proxy_pass in this set targets
#     127.0.0.1, so none of them needs it. A future one might.

# The WebSocket upgrade map, for rpc.<domain>.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# A cheap outer bound in front of the faucet's own per-address and per-client
# limits, so an abusive client is refused here rather than by a process that
# holds a spend key.
limit_req_zone $binary_remote_addr zone=faucet_claim:10m rate=6r/m;

# The public RPC's only real per-caller bound, and it has to live here because
# the node has none.
#
# `--rpc-rate-limit` is "calls/minute for EACH CONNECTION" in the node's own
# help, and the middleware is built per accepted connection, so one client that
# opens 200 sockets gets 200 times the limit and also exhausts
# --rpc-max-connections, which is a refusal at connect for every wallet and
# explorer user. `--rpc-rate-limit-trust-proxy-headers` does not change that:
# in sc-rpc-server the proxy address is used for one thing, deciding whether a
# caller falls inside --rpc-rate-limit-whitelisted-ips and is therefore exempt.
# With no whitelist set the flag is inert.
limit_conn_zone $binary_remote_addr zone=rpc_conn:10m;
limit_req_zone $binary_remote_addr zone=rpc_calls:10m rate=240r/m;

# The real client address, behind the CDN.
#
# Without this, every faucet claim reads as coming from the CDN and the
# per-client limit becomes one global limit. Replace the list below with the
# current published ranges of whichever CDN is in front of this host, and keep
# it current: an address range that is trusted and should not be is a client
# that can set its own CF-Connecting-IP.
#
#   set_real_ip_from 203.0.113.0/24;
#   set_real_ip_from 2001:db8::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;
