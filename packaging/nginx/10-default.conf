# /etc/nginx/sites-available/qnero-default
#
# The default server. Without one, the first vhost nginx parses answers every
# request that arrives with an unknown or absent Host header, which means a
# scan of the host's address is served whichever site sorted first and that
# site's certificate is presented for a name it does not cover.
#
# 444 closes the connection with no response at all, which is the cheapest
# answer to a scanner. The TLS block exists because a TLS handshake happens
# before the Host header does, so refusing at the HTTP layer still needs a
# certificate to refuse with.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    return 444;
}
