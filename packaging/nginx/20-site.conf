# /etc/nginx/sites-available/qnero-site -> <domain>
#
# The project site: static HTML, one stylesheet, two scripts, no build step and
# no third-party request. site/README.md is where this block comes from.

server {
    listen 80;
    listen [::]:80;
    server_name <domain> www.<domain>;
    return 301 https://<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    return 301 https://<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name <domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    root /var/www/<domain>;
    index index.html;

    # The site makes no outbound request of any kind, which is what lets this
    # policy be this narrow. It has no inline script and no inline style
    # precisely so it holds.
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Serve /wallet as well as /wallet.html. Every internal link carries the
    # extension, so the site works with this rule absent.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # svg and png only. css/site.css and the two scripts carry no fingerprint
    # and there is no build step to give them one, so a long max-age would
    # serve a returning reader new HTML against a stylesheet their browser will
    # not re-fetch for a week. They fall through to ETag and Last-Modified,
    # which revalidate on every load and cost one 304.
    #
    # `expires` rather than an add_header here on purpose: a location block
    # that declares its own add_header drops every add_header from the server
    # block, which would silently remove the content policy from every image.
    location ~* \.(svg|png|ico)$ {
        expires 7d;
    }

    # The site's own build tools are not part of the published site.
    location /tools/ {
        return 404;
    }
}
