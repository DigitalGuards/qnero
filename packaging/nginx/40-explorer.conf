# /etc/nginx/sites-available/qnero-explorer -> explorer.<domain>
#
# silQ Road, the block explorer. Static, no threaded wasm, so no COOP or COEP
# here. explorer/README.md is where this block comes from.
#
# Every route lives in the URL fragment, so the only rewrite it needs is the
# index fallback.

server {
    listen 80;
    listen [::]:80;
    server_name explorer.<domain>;
    return 301 https://explorer.<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    root /var/www/explorer.<domain>;
    index index.html;

    # The page talks to the node and to nothing else. A page served over https
    # cannot open a ws:// socket, which is why the endpoint below is wss:// and
    # behind the same TLS.
    #
    # **`'wasm-unsafe-eval'` is what makes the explorer work at all**, and its
    # absence fails in the one way that sends an operator to the wrong place.
    # `@polkadot/api` calls `cryptoWaitReady()` on connect, and
    # `@polkadot/wasm-crypto-init` ships the wasm-only builder with no asm.js
    # fallback, so a policy without it has the browser refuse
    # `WebAssembly.instantiate`, `cryptoWaitReady()` resolves FALSE rather than
    # throwing, `ApiPromise` never emits `ready`, and the page times out into
    # "the node may be down, or this page may be configured with the wrong
    # endpoint" against a node that is perfectly healthy. The tighter
    # alternative is `initWasm: false` at `explorer/src/chain/api.ts`, since the
    # only crypto this page uses is `blake2AsHex` and `util-crypto` has a
    # pure-JS branch for it; this set takes the header instead so the page keeps
    # working if it ever grows a second wasm dependency.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://rpc.<domain>; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store" always;
        # A location with its own add_header inherits none, so the set is
        # repeated rather than lost.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' wss://rpc.<domain>; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
