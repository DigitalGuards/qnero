# /etc/nginx/sites-available/qnero-explorer -> explorer.<domain>
#
# silQ Road, the block explorer. Static, no threaded wasm, so no COOP or COEP
# here. explorer/README.md is where this block comes from.
#
# Every route lives in the URL fragment, so the only rewrite it needs is the
# index fallback.

server {
    listen 80;
    listen [::]:80;
    server_name explorer.<domain>;
    return 301 https://explorer.<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name explorer.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    root /var/www/explorer.<domain>;
    index index.html;

    # The page talks to the node and to nothing else. A page served over https
    # cannot open a ws:// socket, which is why the endpoint below is wss:// and
    # behind the same TLS.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://rpc.<domain>; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = /config.json {
        expires -1;
        add_header Cache-Control "no-store" always;
        # A location with its own add_header inherits none, so the set is
        # repeated rather than lost.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://rpc.<domain>; img-src 'self' data:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
