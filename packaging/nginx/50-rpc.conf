# /etc/nginx/sites-available/qnero-rpc -> rpc.<domain>
#
# The node's JSON-RPC WebSocket, which is what both wallets and the explorer
# connect to. The node binds 127.0.0.1:9944 and never a public interface, so
# this is the only way in and --rpc-methods safe is what bounds it.
#
# **proxy_read_timeout 400s is the number, and the chain is the reason.** A
# head subscription on a 120 s chain can legitimately go three block intervals
# without a frame, and nginx's default of 60 s would drop the socket underneath
# a wallet that is merely waiting. proxy_buffering off matters for the same
# reason: a subscription is a stream, and buffering would hold each frame
# until the response that never ends is complete.
#
# Whether this name is proxied by the CDN is a decision, and the runbook
# records which was made. A proxied record adds the CDN's own read timeout,
# around 100 s on the entry plan, on top of everything here; both wallets
# reconnect and drive their status strip off the socket rather than deciding
# once at connect, so a reconnect is survivable. DNS-only removes the question
# and also removes the CDN's protection from the node's RPC.

server {
    listen 80;
    listen [::]:80;
    server_name rpc.<domain>;
    return 301 https://rpc.<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name rpc.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    # A JSON-RPC body is small. This bounds what an unauthenticated caller can
    # make the node parse.
    client_max_body_size 256k;

    location / {
        # The per-caller bound, and "per caller" is a claim that depends on
        # something outside this file: `$limit_key` in 00-qnero-common.conf is
        # the real client address only once `set_real_ip_from` covers the CDN.
        # Without that list this is a cap on the number of sockets the entire
        # internet may hold open at once, because every request arrives from a
        # handful of edge addresses. Hence the include there, which fails
        # `nginx -t` while the list is missing rather than serving a global cap
        # that reads like a per-caller one.
        #
        # Sixteen against `--rpc-max-connections 200` in the node's unit: a
        # page opens one socket, so this is a browser's worth of tabs and then
        # some, and it takes a dozen distinct callers to exhaust the node. The
        # number to revisit is this one rather than the node's, and the case
        # for raising it is carrier-grade NAT or an office, where every user
        # shares one address and therefore these sixteen sockets.
        limit_conn rpc_conn 16;
        limit_req  zone=rpc_calls burst=60 nodelay;
        limit_conn_status 429;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:9944;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The upstream's own authority, and the node is the reason a $host
        # here breaks everything.
        # jsonrpsee's host filter is switched on by `--rpc-cors` being set to
        # anything other than `all`, and the allowlist it builds is exactly
        # `localhost:<port>` and `127.0.0.1:<port>`. Forwarding `Host:
        # rpc.<domain>` therefore gets every call answered with the plain-text
        # body "Provided Host header is not whitelisted." under a 403, which is
        # not JSON-RPC, so a wallet reports the endpoint as unreachable and the
        # node's own log says nothing at all. Browser origin checking is
        # untouched by this: the `Origin` header is what --rpc-cors validates
        # and nginx passes it through unchanged.
        proxy_set_header Host 127.0.0.1:9944;
        # Passed for the node's logs. It is NOT what bounds a caller: the
        # node's --rpc-rate-limit counts per connection, and the proxy header
        # it can be told to trust only decides whitelist membership, which is
        # empty here. The two limits above are the bound.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 400s;
        proxy_send_timeout 400s;
        proxy_buffering off;
    }
}
