# /etc/nginx/sites-available/qnero-faucet -> faucet.<domain>
#
# The faucet, on 127.0.0.1:8080. nginx is the only thing in front of it.
#
# The 30 s read timeout is right because POST /drip enqueues and returns: it
# does not wait for the proof. If it ever waited, that number would have to
# clear a ten-second proof plus a 120 s block and the socket would become a
# long poll, which is the wrong shape for one prover. Keep it enqueue and poll.

server {
    listen 80;
    listen [::]:80;
    server_name faucet.<domain>;
    return 301 https://faucet.<domain>$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faucet.<domain>;

    ssl_certificate     /home/<user>/ssl/<domain>/cert.pub;
    ssl_certificate_key /home/<user>/ssl/<domain>/key.priv;

    # The only body is an address and a challenge token.
    client_max_body_size 4k;

    # Turnstile needs both its script and its frame. Without a site key
    # configured the page embeds neither and this could be narrower, but a
    # policy that changes when a variable changes is a policy nobody checks.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        # The faucet reads this for its per-client limit, and trusts it only
        # from a loopback peer, which nginx always is. real_ip_header in
        # 00-qnero-common.conf is what makes $remote_addr the client's address
        # rather than the CDN's.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # A cheap outer bound in front of the faucet's own limits. 6 requests a
    # minute with a burst of 3, so an abusive client is refused here rather
    # than by a process holding a spend key.
    location = /drip {
        limit_req zone=faucet_claim burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        # No add_header here, on purpose: this location inherits the server
        # block's three. Adding one would silently drop all of them.
    }
}
