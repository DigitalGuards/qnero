# /etc/systemd/system/nginx.service.d/restart.conf
#
# A transient startup failure must self-heal rather than sit dead. This is the
# lesson of a nine-hour outage on a sibling deployment: nginx failed its config
# test during an unattended-upgrades restart because a proxied upstream
# hostname briefly would not resolve, and then stayed down. Every site served a
# CDN 521 for nine hours while every application behind it was healthy, and the
# on-box monitor stayed green the whole time because every check it made probed
# loopback.
#
# Two fixes came out of that and this is one. The other is in the vhosts: any
# proxy_pass to an external hostname must resolve at request time, or a DNS
# blip fails `nginx -t` and takes every vhost on the host offline. Every
# proxy_pass in packaging/nginx targets 127.0.0.1, so that one does not bite
# here, and it is written down so a future vhost does not reintroduce it.

[Service]
Restart=on-failure
RestartSec=30s
