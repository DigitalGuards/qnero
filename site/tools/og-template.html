<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Qnero open graph card</title>
    <style>
      /*
       * The source of site/img/og.png. Rendered at 1200x630 by tools/make-images.mjs.
       * Same palette, same typefaces and same mark as the site: this is a page,
       * photographed.
       *
       * The values are brand/tokens.css's, written out rather than loaded from
       * it: this file renders under file:// in a headless browser, it is
       * photographed once, and the pixels are what ship. A `var()` that failed
       * to resolve here would produce a black card rather than an error.
       * `scripts/check-contrast.mjs` measures the tokens; this card is checked
       * by looking at it.
       */
      @font-face {
        font-family: 'Archivo';
        font-weight: 100 900;
        font-stretch: 62% 125%;
        src: url('../css/fonts/archivo-variable-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('../css/fonts/ibm-plex-mono-400-latin.woff2') format('woff2');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 500;
        src: url('../css/fonts/ibm-plex-mono-500-latin.woff2') format('woff2');
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #141312;
        color: #f4f2f0;
        font-family: Archivo, sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 64px 72px;
      }
      .strip {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 17px;
        letter-spacing: 1.4px;
        text-transform: uppercase;
        color: #a8a29a;
      }
      .dot {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: #ff6600;
      }
      .lockup {
        display: flex;
        align-items: center;
        gap: 26px;
        margin: 0 0 20px;
      }
      .lockup svg {
        width: 92px;
        height: 92px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 108px;
        line-height: 1;
        letter-spacing: -3px;
        font-weight: 800;
        font-stretch: 125%;
        color: #ffffff;
      }
      p {
        margin: 0;
        font-size: 38px;
        line-height: 1.3;
        color: #f4f2f0;
        max-width: 22ch;
        letter-spacing: -0.5px;
      }
      .facts {
        display: flex;
        gap: 40px;
        justify-content: space-between;
        border-top: 1px solid #2e2b28;
        padding-top: 26px;
        font-size: 19px;
        color: #c9c3bb;
      }
      .facts > div {
        flex: 1 1 0;
      }
      /* The privacy value is the longest of the four and is the one that has to
         match the at-a-glance row on the home page word for word, so its column
         takes the room it needs and the other three still set one line each. */
      .facts > div:first-child {
        flex: 1.45 1 0;
      }
      .facts b {
        display: block;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 13px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        color: #a8a29a;
        font-weight: 400;
        margin-bottom: 7px;
      }
      .foot {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 19px;
        letter-spacing: 1.2px;
        color: #ff6600;
      }
      .foot .repo {
        color: #a8a29a;
      }
    </style>
  </head>
  <body>
    <div class="strip">
      <span class="dot"></span>
      <span>Pre-alpha &middot; public testnet, may be reset &middot; unaudited</span>
    </div>
    <div>
      <div class="lockup">
        <svg viewBox="0 0 108 108" aria-hidden="true">
          <rect x="0" y="0" width="46" height="46" rx="5" fill="#f4f2f0" />
          <rect x="54" y="0" width="46" height="46" rx="5" fill="#f4f2f0" />
          <rect x="0" y="54" width="46" height="46" rx="5" fill="#f4f2f0" />
          <rect x="62" y="62" width="46" height="46" rx="5" fill="#ff6600" />
        </svg>
        <h1>Qnero</h1>
      </div>
      <p>Monero's principles, rebuilt without elliptic curves.</p>
    </div>
    <div class="facts">
      <div><b>Privacy</b>Mandatory for user transfers</div>
      <div><b>Consensus</b>RandomX, stock rx/0</div>
      <div><b>Block time</b>120 seconds</div>
      <div><b>Supply</b>21M QNR cap</div>
    </div>
    <div class="foot">
      <span>qnero.io</span>
      <span class="repo">github.com/DigitalGuards/qnero</span>
    </div>
  </body>
</html>
