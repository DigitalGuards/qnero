<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Qloak, a Qnero wallet</title>
    <link rel="canonical" href="https://wallet.qnero.io/" />
    <!-- The tab mark, written inline so it costs no request and adds no asset.
         A tab narrowed past its title, a pinned tab and a bookmark are the
         icon and nothing else, and with none declared both Qnero apps sat
         there as the browser's blank page glyph and took a 404 on
         /favicon.ico from the host on every load. A `data:` image is what this
         page's own content policy already admits, for the QR codes.

         It is `brand/favicon.svg`: four squares as a 4-ary Poseidon node with
         one leaf lit and displaced. Every Qnero surface carries the same mark,
         so a tab says Qnero and its title says which part. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Crect width='120' height='120' rx='19' fill='%23141312'/%3E%3Crect x='22' y='22' width='34' height='34' rx='4' fill='%23f4f2f0'/%3E%3Crect x='64' y='22' width='34' height='34' rx='4' fill='%23f4f2f0'/%3E%3Crect x='22' y='64' width='34' height='34' rx='4' fill='%23f4f2f0'/%3E%3Crect x='70' y='70' width='34' height='34' rx='4' fill='%23ff6600'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Qloak is a browser wallet for a Qnero chain. Keys are generated and used in the page, proofs are built on this machine, and nothing is contacted but the node you configure."
    />
    <!-- No preconnect, no font host, no analytics. The configured node is the
         only thing this page contacts, and the settings screen says so.

         The Content-Security-Policy that enforces that is injected into the
         built HTML by `vite.config.ts` and served as a header by the dev and
         preview servers. It is not written here, so the policy and the header
         a deployment should send cannot drift apart: one constant produces
         both. `README.md` carries the header for a production host. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
